<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D49B53" />
      <stop offset="100%" stop-color="#8C581E" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F5EFE4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background rounded squircle with safe zone padding -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  
  <!-- Central Safe Zone Graphic (Meeting + Audio Waves + AI) -->
  <g filter="url(#shadow)" transform="translate(64, 64)">
    <!-- Video / Meeting Camera Frame -->
    <rect x="44" y="80" width="210" height="150" rx="36" fill="url(#accentGrad)" />
    <!-- Camera lens cone -->
    <path d="M260 115 L330 75 L330 235 L260 195 Z" fill="url(#accentGrad)" rx="12" />
    
    <!-- Microphone / Waveform bars inside -->
    <rect x="85" y="125" width="14" height="60" rx="7" fill="#B88037" />
    <rect x="115" y="105" width="14" height="100" rx="7" fill="#D49B53" />
    <rect x="145" y="115" width="14" height="80" rx="7" fill="#8C581E" />
    <rect x="175" y="135" width="14" height="40" rx="7" fill="#B88037" />
    <rect x="205" y="140" width="14" height="30" rx="7" fill="#D49B53" />
    
    <!-- AI Sparkle 4-point star -->
    <path d="M300 240 Q300 280 340 280 Q300 280 300 320 Q300 280 260 280 Q300 280 300 240 Z" fill="#FFE2B3" />
  </g>
</svg>
